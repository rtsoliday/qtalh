name: Documentation
on:
  push:
    paths: ['docs/**', 'scripts/*docs.py', 'README.md', 'AUTHORS.md', 'LICENSE', 'examples/**', 'alh/documentation/**', 'qtalh/tests/README.md', 'qtalh/services/options.cc', 'qtalh/core/config.cc', '.github/workflows/documentation.yml']
  pull_request:
    paths: ['docs/**', 'scripts/*docs.py', 'README.md', 'AUTHORS.md', 'LICENSE', 'examples/**', 'alh/documentation/**', 'qtalh/tests/README.md', 'qtalh/services/options.cc', 'qtalh/core/config.cc', '.github/workflows/documentation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci --prefix docs/site
      - run: python3 scripts/build-docs.py
      - uses: actions/upload-artifact@v4
        with:
          name: qtalh-documentation-html
          path: docs/html
